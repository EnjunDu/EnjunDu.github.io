<script async defer src="https://buttons.github.io/buttons.js"></script>
<style>
/* ========================================
   Experience/Education: card layout
   with LARGE logos on the left
   ======================================== */

/* Replace the subtle default timeline with a clear upward-growing rail. */
.blox-resume-experience ol.relative.border-s {
  border-left: none !important;
  position: relative;
  padding-left: 2.25rem;
}
.blox-resume-experience ol.relative.border-s::before {
  content: "";
  position: absolute;
  left: 0.625rem;
  top: 0;
  bottom: 0.35rem;
  width: 3px;
  border-radius: 999px;
  background: linear-gradient(
    to top,
    rgb(var(--color-primary-700)),
    rgb(var(--color-primary-300))
  );
  box-shadow: 0 0 0 1px rgb(var(--color-primary-500) / 0.12);
}
.blox-resume-experience ol.relative.border-s::after {
  content: "";
  position: absolute;
  left: 0.19rem;
  top: -0.7rem;
  width: 0;
  height: 0;
  border-left: 7px solid transparent;
  border-right: 7px solid transparent;
  border-bottom: 12px solid rgb(var(--color-primary-400));
  filter: drop-shadow(0 2px 2px rgb(var(--color-primary-700) / 0.25));
}
.blox-resume-experience ol.relative > li .absolute.-start-3 {
  display: none !important;
}

/* Each timeline item becomes a card with logo on the left */
.blox-resume-experience ol.relative > li.mb-10.ms-6 {
  margin-left: 0 !important;
  padding: 22px 28px 22px 170px !important;
  position: relative !important;
  background: #fff;
  border: 1px solid #e5e7eb;
  border-radius: 16px;
  box-shadow: var(--hb-shadow-sm);
  margin-bottom: 20px !important;
  min-height: 140px;
  transition: box-shadow .2s ease, transform .2s ease, border-color .2s ease;
}
.blox-resume-experience ol.relative > li.mb-10.ms-6::before {
  content: "";
  position: absolute;
  left: -2.05rem;
  top: 2rem;
  z-index: 2;
  width: 0.875rem;
  height: 0.875rem;
  border: 3px solid #fff;
  border-radius: 999px;
  background: rgb(var(--color-primary-500));
  box-shadow: 0 0 0 3px rgb(var(--color-primary-400) / 0.24);
  transition: transform .2s ease, box-shadow .2s ease;
}
.blox-resume-experience ol.relative > li.mb-10.ms-6:hover {
  box-shadow: var(--hb-shadow-md);
  transform: translateY(-2px);
  border-color: rgb(var(--color-primary-300));
}
.blox-resume-experience ol.relative > li.mb-10.ms-6:hover::before {
  transform: scale(1.15);
  box-shadow: 0 0 0 5px rgb(var(--color-primary-400) / 0.2);
}
.dark .blox-resume-experience ol.relative > li.mb-10.ms-6 {
  background: #1f2937;
  border-color: #374151;
}
.dark .blox-resume-experience ol.relative > li.mb-10.ms-6::before {
  border-color: #111827;
  background: rgb(var(--color-primary-400));
}
.dark .blox-resume-experience ol.relative > li.mb-10.ms-6:hover {
  border-color: rgb(var(--color-primary-700));
}

/* Make roles and degrees visually scannable instead of secondary gray text. */
.blox-resume-experience ol.relative > li > h3 + span.block {
  display: inline-flex !important;
  align-items: center;
  width: fit-content;
  max-width: 100%;
  margin-bottom: 0.75rem !important;
  padding: 0.38rem 0.72rem;
  border: 1px solid rgb(var(--color-primary-200));
  border-radius: 999px;
  background: rgb(var(--color-primary-50));
  color: rgb(var(--color-primary-700)) !important;
  font-size: 0.9rem !important;
  font-weight: 700 !important;
  line-height: 1.3 !important;
  box-shadow: inset 0 1px 0 rgb(255 255 255 / 0.7);
}
.blox-resume-experience ol.relative > li > h3 + span.block::before {
  content: "";
  flex: 0 0 auto;
  width: 0.42rem;
  height: 0.42rem;
  margin-right: 0.5rem;
  border-radius: 999px;
  background: rgb(var(--color-primary-500));
}
.dark .blox-resume-experience ol.relative > li > h3 + span.block {
  border-color: rgb(var(--color-primary-700) / 0.7);
  background: rgb(var(--color-primary-900) / 0.45);
  color: rgb(var(--color-primary-300)) !important;
  box-shadow: none;
}
.dark .blox-resume-experience ol.relative > li > h3 + span.block::before {
  background: rgb(var(--color-primary-400));
}

/* On wide screens, place dates on the left side of the timeline rail. */
@media (min-width: 1024px) {
  .blox-resume-experience ol.relative > li > time {
    position: absolute;
    top: 1.35rem;
    right: calc(100% + 3rem);
    display: flex !important;
    align-items: center;
    justify-content: flex-end;
    width: 9.25rem;
    height: 2.25rem;
    margin: 0 !important;
    padding: 0 0.65rem;
    border: 1px solid rgb(var(--color-primary-200));
    border-radius: 0.6rem;
    background: rgb(var(--color-primary-50) / 0.92);
    color: rgb(var(--color-primary-700)) !important;
    box-shadow: var(--hb-shadow-sm);
    font-size: 0.8rem !important;
    font-weight: 700 !important;
    line-height: 1.35 !important;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.015em;
    text-align: right;
    white-space: nowrap;
  }
  .blox-resume-experience ol.relative > li > time::after {
    content: "";
    position: absolute;
    top: 50%;
    right: -1.05rem;
    width: 1rem;
    height: 2px;
    border-radius: 999px;
    background: rgb(var(--color-primary-300));
    transform: translateY(-50%);
  }
  .dark .blox-resume-experience ol.relative > li > time {
    border-color: rgb(var(--color-primary-700) / 0.7);
    background: rgb(var(--color-primary-900) / 0.72);
    color: rgb(var(--color-primary-300)) !important;
  }
  .dark .blox-resume-experience ol.relative > li > time::after {
    background: rgb(var(--color-primary-600));
  }
}

/* The injected logo image — BIG and clear */
.blox-resume-experience ol.relative > li .exp-logo {
  position: absolute !important;
  left: 18px !important;
  top: 50% !important;
  transform: translateY(-50%) !important;
  width: 130px !important;
  height: 130px !important;
  object-fit: contain !important;
  background: white;
  border-radius: 14px;
  padding: 10px;
  border: 1px solid #e5e7eb;
}
.dark .blox-resume-experience ol.relative > li .exp-logo {
  background: #f9fafb;
  border-color: #4b5563;
}

/* ========================================
   Talks section: constrain image size
   ======================================== */
#talks article img {
  max-height: 220px !important;
  object-fit: cover !important;
  border-radius: 8px !important;
}

/* Publication card responsive layout now lives in assets/css/custom.css
   (.hb-pub-card and friends) alongside the rest of the design system. */

@media (max-width: 768px) {
  .blox-resume-experience ol.relative.border-s {
    padding-left: 1.75rem;
  }
  .blox-resume-experience ol.relative.border-s::before {
    left: 0.5rem;
  }
  .blox-resume-experience ol.relative.border-s::after {
    left: 0.065rem;
  }
  /* Experience cards: stack on mobile */
  .blox-resume-experience ol.relative > li.mb-10.ms-6 {
    padding: 16px 16px 16px 16px !important;
    padding-top: 100px !important;
    min-height: auto !important;
  }
  .blox-resume-experience ol.relative > li.mb-10.ms-6::before {
    left: -1.625rem;
    top: 1.5rem;
    width: 0.75rem;
    height: 0.75rem;
  }
  .blox-resume-experience ol.relative > li .exp-logo {
    position: absolute !important;
    left: 50% !important;
    top: 12px !important;
    transform: translateX(-50%) !important;
    width: 70px !important;
    height: 70px !important;
    padding: 6px !important;
  }
}

/* ========================================
   Publication list: click title → blog
   Redirect publications with url_project
   pointing to /blog/* to blog page
   ======================================== */
</style>
<script>
document.addEventListener("DOMContentLoaded", function() {
  // === 1. Experience/Education logos ===
  var logoMap = {
  "Project Up": "/images/logos/tencent_project_up.png",
  "YuanBao": "/images/logos/yuanbao.png",
  "Tencent": "/images/logos/tencent.png",
  "Beijing Institute": "/images/logos/bit.png",
  "The University of Hong Kong": "/images/logos/HKU.jpeg",
  "The Hong Kong University of Science and Technology (Guangzhou)": "/images/logos/HKUST.png"
};

  var items = document.querySelectorAll(".blox-resume-experience ol.relative > li");
  items.forEach(function(li) {
    var text = li.textContent || "";
    for (var keyword in logoMap) {
      if (text.indexOf(keyword) !== -1) {
        li.style.position = "relative";
        var img = document.createElement("img");
        img.src = logoMap[keyword];
        img.alt = keyword;
        img.className = "exp-logo";
        li.appendChild(img);
        break;
      }
    }
  });

  // === 2. Publication title click → blog page ===
  // For any publication that has url_project pointing to /blog/*,
  // rewrite the title link to go to the blog page instead of /publication/xxx/
  // This works automatically — no need to hardcode paper names.
  var pubLinks = document.querySelectorAll('a[href*="/publication/"]');
  pubLinks.forEach(function(titleLink) {
    // Find the parent container of this publication entry
    var container = titleLink.closest('li, article, .citation, div');
    if (!container) return;

    // Look for a "Project" button link that points to /blog/
    var projectLink = container.querySelector('a[href*="/blog/"]');
    if (projectLink) {
      titleLink.href = projectLink.href;
      return;
    }

    // Also check: the titleLink itself might be /publication/xxx/
    // Find if there's a sibling or nearby link to /blog/
    var allLinks = container.querySelectorAll('a[href*="/blog/"]');
    if (allLinks.length > 0) {
      titleLink.href = allLinks[0].href;
    }
  });

  // === 3. Homepage navigation scroll position ===
  if (window.location.pathname === "/" || window.location.pathname === "/index.html") {
    var navMenu = document.getElementById("nav-menu");
    if (!navMenu) return;

    var navLinks = Array.from(navMenu.querySelectorAll(".nav-link"));
    var sectionIdsByLabel = {
      "Bio": "bio",
      "Experience": "experience",
      "Papers": "papers",
      "Talks": "talks",
      "News": "news",
      "Contact Me": "contact-me"
    };

    var trackedSections = navLinks
      .map(function(link) {
        var id = sectionIdsByLabel[(link.textContent || "").trim()];
        var section = id ? document.getElementById(id) : null;
        return section ? { link: link, section: section } : null;
      })
      .filter(Boolean)
      .sort(function(a, b) {
        return a.section.offsetTop - b.section.offsetTop;
      });

    function setActiveNav(activeLink) {
      navLinks.forEach(function(link) {
        var isActive = link === activeLink;
        link.classList.toggle("hb-scroll-active", isActive);
        link.classList.toggle("active", isActive);
        if (isActive) {
          link.setAttribute("aria-current", "location");
        } else {
          link.removeAttribute("aria-current");
        }
      });
    }

    var scrollUpdateQueued = false;
    function updateActiveNav() {
      scrollUpdateQueued = false;
      if (!trackedSections.length) return;

      var header = document.getElementById("site-header");
      var headerHeight = header ? header.getBoundingClientRect().height : 0;
      var readingLine = window.scrollY + headerHeight + Math.min(window.innerHeight * 0.24, 180);
      var active = trackedSections[0];

      trackedSections.forEach(function(item) {
        if (item.section.offsetTop <= readingLine) active = item;
      });

      if (window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 8) {
        active = trackedSections[trackedSections.length - 1];
      }

      setActiveNav(active.link);
    }

    function queueActiveNavUpdate() {
      if (scrollUpdateQueued) return;
      scrollUpdateQueued = true;
      window.requestAnimationFrame(updateActiveNav);
    }

    navLinks.forEach(function(link) {
      link.addEventListener("click", function() {
        var id = sectionIdsByLabel[(link.textContent || "").trim()];
        if (id) setActiveNav(link);
      });
    });

    window.addEventListener("scroll", queueActiveNavUpdate, { passive: true });
    window.addEventListener("resize", queueActiveNavUpdate);
    updateActiveNav();
  }
});
</script>
